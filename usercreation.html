        </div>

                </a>
            </li>
            <li>

    <div class="main-content">
        <header class="topbar">
        </header>

        <section class="page-header">
            <h1>User Account Creation</h1>
            <p>Create and manage accounts for administrators and visitors.</p>
        </section>

        <section class="table-section">
            <div class="table-header">
                <h2>Create New Account</h2>
            </div>
            <form id="accountForm" class="record-form">
                <label>
                    Full Name
                    <input type="text" id="fullName" placeholder="Enter full name" required>
                </label>
                <label>
                    Username
                    <input type="text" id="username" placeholder="Enter username" required>
                </label>
                <label>
                    Email Address
                    <input type="email" id="email" placeholder="Real email address used to sign in" required>
                </label>
                <label>
                    Password
                    <span class="password-input-wrapper">
                        <input type="password" id="password" placeholder="Enter password" required>
                        <button type="button" class="password-toggle" data-password-target="password" aria-label="Show password" title="Show password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </span>
                </label>
                <label>
                    Confirm Password
                    <span class="password-input-wrapper">
                        <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                        <button type="button" class="password-toggle" data-password-target="confirmPassword" aria-label="Show password" title="Show password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </span>
                </label>
                <label>
                    Account Role
                    <select id="role" required>
                        <option value="">Select role</option>
                        <option value="admin">Administrator</option>
                        <option value="visitor">Visitor</option>
                    </select>
                </label>
                <label id="graveSelectionWrapper" style="display:none;">
                    Select Grave
                    <select id="graveSelection"></select>
                </label>
                <div class="form-actions">
                    <button type="submit" class="add-btn">Create Account</button>
                    <button type="reset" class="secondary-btn">Clear</button>
                </div>
                <p id="formMessage" class="form-message"></p>
            </form>
        </section>

        <section class="table-section" style="margin-top:24px;">
            <div class="table-header">
                <h2>Existing Accounts</h2>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="accountTableBody"></tbody>
            </table>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script>
        /* The Supabase client and the session helpers come from auth.js. */
        let userAccounts = [];
        let userCreationBurialRecords = [];

        async function loadUsersFromSupabase() {
            const { data, error } = await supabaseClient
                .from("profiles")
                .select("*")
                .order("role")
                .order("username");

            if (error) {
                console.warn("Unable to load profiles from Supabase:", error.message);
                userAccounts = [];
                renderAccounts([]);
                return;
            }

            userAccounts = Array.isArray(data) ? data : [];
            renderAccounts(userAccounts);
        }

        /* Creating a login must go through Supabase Auth. A second client that
           does not keep a session is used so the administrator stays signed in.
           Requires: Authentication -> Email -> "Confirm email" = OFF. */
        async function createAuthAccount(fullName, username, email, password) {
            const tempClient = window.supabase.createClient(supabaseUrl, supabaseKey, {
                auth: { persistSession: false, autoRefreshToken: false }
            });

            const { data, error } = await tempClient.auth.signUp({
                email: email.trim(),
                password,
                options: { data: { full_name: fullName, username } }
            });

            if (error) {
                console.warn("Unable to create the account:", error.message);

                /* Duplicate address. Supabase reports this as a REAL error
                   ("user_already_exists" / HTTP 422) while "Confirm email" is
                   OFF - which is this application's setting. Verified against
                   the live project on 2026-09-29. */
                if (error.code === "user_already_exists" ||
                    /already\s+(registered|exists)/i.test(error.message || "")) {
                    return {
                        duplicateEmail: true,
                        error: "That email address is already registered. Use a different email address."
                    };
                }

                return { error: error.message };
            }

            if (!data || !data.user) {
                return { error: "Supabase did not return a new user. Turn OFF \"Confirm email\" in Authentication settings." };
            }

            /* If "Confirm email" is ever switched ON, Supabase hides the
               duplicate case behind a decoy user with an EMPTY identities
               array instead of returning an error. Keep this as a fallback so
               the behaviour stays correct either way. */
            if (Array.isArray(data.user.identities) && data.user.identities.length === 0) {
                return {
                    duplicateEmail: true,
                    error: "That email address is already registered. Use a different email address."
                };
            }

            /* If "Confirm email" is ever switched ON there is no session yet.
               The account and its profile still exist, but the new user cannot
               sign in until they click the link, so say so instead of
               reporting a plain success. */
            if (!data.session) {
                return { user: data.user, pendingConfirmation: true };
            }

            return { user: data.user };
        }

        async function updateProfile(id, changes) {
            const { error } = await supabaseClient
                .from("profiles")
                .update(changes)
                .eq("id", id);

            if (error) {
                console.warn("Unable to update the profile:", error.message);
                return false;
            }

            return true;
        }

        async function deleteUserFromSupabase(id) {
            const { error } = await supabaseClient
                .from("profiles")
                .delete()
                .eq("id", id);

            if (error) {
                console.warn("Unable to delete the profile:", error.message);
                return false;
            }

            return true;
        }

        async function getBurialRecordsFromSupabase() {
            const { data, error } = await supabaseClient
                .from("burial_records")
                .select("*")
                .order("id");

            if (error) {
                console.warn("Unable to load burial records for account creation:", error.message);
                return [];
            }

            return Array.isArray(data) ? data : [];
        }

        async function loadBurialRecordsForUserCreation() {
            userCreationBurialRecords = await getBurialRecordsFromSupabase();
            populateGraveSelection();
        }

        /* Assigning a grave now only updates the account row. It no longer
           rewrites the burial record and no longer writes a fake
           "graves condition" notification (that produced rows such as
           "Occupied -> Assigned" which visitors were shown as condition news). */
        async function assignVisitorGrave(profileId, selectedGraveValue) {
            const records = userCreationBurialRecords;
            const [block, plot] = (selectedGraveValue || "").split("|");

            const selectedRecord = records.find((record) => record.block === block && record.plot === plot);

            if (!selectedRecord) {
                return { error: "The selected plot could not be found." };
            }

            if (!await updateProfile(profileId, { assigned_record_id: selectedRecord.id })) {
                return { error: "The plot could not be assigned to this account." };
            }

            return { record: selectedRecord };
        }

        function renderAccounts(accounts = []) {
            const body = document.getElementById("accountTableBody");
            body.innerHTML = "";

            if (!accounts.length) {
                body.innerHTML = '<tr><td colspan="4" class="empty-state">No accounts created yet.</td></tr>';
                return;
            }

            accounts.forEach((account) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${account.full_name}</td>
                    <td>${account.username}</td>
                    <td>${account.role === "admin" ? "Administrator" : "Visitor"}</td>
                    <td>
                        <button type="button" class="table-action-btn delete-btn" onclick="deleteAccount('${account.id}')">Delete</button>
                    </td>
                `;
                body.appendChild(row);
            });
        }

        function populateGraveSelection() {
            const graveSelect = document.getElementById("graveSelection");
            const wrapper = document.getElementById("graveSelectionWrapper");
            const role = document.getElementById("role").value;

            if (!graveSelect || !wrapper) {
                return;
            }

            if (role !== "visitor") {
                wrapper.style.display = "none";
                graveSelect.innerHTML = "";
                return;
            }

            const records = userCreationBurialRecords;

            /* Available AND Occupied plots can be assigned. A visitor is often a
               relative who needs access to the record of someone already
               buried, not only to an empty plot. "Reserved" stays out because
               that plot is already promised to another application. */
            const assignableStatuses = ["Available", "Occupied"];

            const allGraves = records
                .filter((record) => assignableStatuses.includes(record.status))
                .sort((a, b) => {
                    // free plots first, so they stay easy to find
                    if (a.status !== b.status) {
                        return a.status === "Available" ? -1 : 1;
                    }
                    if (a.block !== b.block) {
                        return String(a.block).localeCompare(String(b.block), undefined, { numeric: true });
                    }
                    return String(a.plot).localeCompare(String(b.plot), undefined, { numeric: true });
                })
                .map((record) => ({
                    value: `${record.block}|${record.plot}|${record.id}`,
                    label: `${record.block} - Plot ${record.plot} (${record.status})`
                }));

            graveSelect.innerHTML = "";

            const defaultOption = document.createElement("option");
            defaultOption.value = "";
            defaultOption.textContent = "Select a grave";
            graveSelect.appendChild(defaultOption);

            allGraves.forEach((grave) => {
                const option = document.createElement("option");
                option.value = grave.value;
                option.textContent = grave.label;
                graveSelect.appendChild(option);
            });

            wrapper.style.display = "block";
        }

        async function deleteAccount(id) {
            await deleteUserFromSupabase(id);
            await loadUsersFromSupabase();
            const message = document.getElementById("formMessage");
            message.textContent = "Account deleted. The login itself still exists in Authentication -> Users.";
            message.className = "form-message success";
        }

        document.getElementById("accountForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const fullName = document.getElementById("fullName").value.trim();
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const role = document.getElementById("role").value;
            const message = document.getElementById("formMessage");

            if (!fullName || !username || !email || !password || !confirmPassword || !role) {
                message.textContent = "Please complete all fields.";
                message.className = "form-message error";
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                message.textContent = "Please enter a valid email address.";
                message.className = "form-message error";
                document.getElementById("email").focus();
                return;
            }

            if (password.length < 6) {
                message.textContent = "The password must be at least 6 characters.";
                message.className = "form-message error";
                document.getElementById("password").focus();
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = "Password and confirm password do not match.";
                message.className = "form-message error";
                document.getElementById("confirmPassword").focus();
                return;
            }

            const accounts = userAccounts.slice();
            const usernameExists = accounts.some((account) => account.username.toLowerCase() === username.toLowerCase());

            if (usernameExists) {
                message.textContent = "That username already exists.";
                message.className = "form-message error";
                return;
            }

            // check the grave BEFORE creating the login, otherwise a failed
            // validation would leave an account behind with no plot
            let selectedGraveValue = "";
            if (role === "visitor") {
                selectedGraveValue = document.getElementById("graveSelection").value;
                if (!selectedGraveValue) {
                    message.textContent = "Please select an available grave for the visitor.";
                    message.className = "form-message error";
                    return;
                }
            }

            // 1. create the login in Supabase Auth (the trigger creates the profile)
            const created = await createAuthAccount(fullName, username, email, password);
            if (created.duplicateEmail) {
                message.textContent = created.error;
                message.className = "form-message error";
                document.getElementById("email").focus();
                return;
            }
            if (created.error) {
                message.textContent = "Account could not be created: " + created.error;
                message.className = "form-message error";
                return;
            }

            const profileId = created.user.id;

            // 2. apply the real role and name on the profile row
            if (!await updateProfile(profileId, { role, full_name: fullName, username })) {
                message.textContent = "The account was created but its role could not be set. Please reload and try again.";
                message.className = "form-message error";
                return;
            }

            // 3. give the visitor their plot
            let assignedRecord = null;
            if (role === "visitor") {
                const assigned = await assignVisitorGrave(profileId, selectedGraveValue);
                if (assigned.error) {
                    message.textContent = "The account was created, but " + assigned.error;
                    message.className = "form-message error";
                    await loadUsersFromSupabase();
                    return;
                }
                assignedRecord = assigned.record;
            }

            await loadUsersFromSupabase();

            this.reset();
            document.getElementById("graveSelectionWrapper").style.display = "none";
            let successText = role === "visitor"
                ? `Account created. Grave assigned: ${assignedRecord.block} / ${assignedRecord.plot}`
                : "Administrator account created.";

            if (created.pendingConfirmation) {
                successText += " This user must confirm their email address before they can sign in.";
                message.className = "form-message error";
            } else {
                message.className = "form-message success";
            }

            message.textContent = successText;
        });

        document.getElementById("role").addEventListener("change", populateGraveSelection);

        document.querySelectorAll(".password-toggle").forEach((toggleButton) => {
            toggleButton.addEventListener("click", () => {
                const passwordInput = document.getElementById(toggleButton.dataset.passwordTarget);
                const icon = toggleButton.querySelector("i");
                const isHidden = passwordInput.type === "password";

                passwordInput.type = isHidden ? "text" : "password";
                toggleButton.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
                toggleButton.title = isHidden ? "Hide password" : "Show password";
                icon.className = isHidden ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
            });
        });

        /* Only an administrator may open this page. This is the guard the page
           was missing completely before. */
        (async () => {
            const profile = await requireAccess("admin");
            if (!profile) {
                return;
            }

            renderAccounts();
            await loadBurialRecordsForUserCreation();
            await loadUsersFromSupabase();
        })();
    </script>
</body>
